      # We explicitly deploy to /Workspace/Users/sidneilimasantos26@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/sidneilimasantos26@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dbk_estudo_bundle_prod
      schema: prod
    permissions:
      - user_name: sidneilimasantos26@gmail.com
