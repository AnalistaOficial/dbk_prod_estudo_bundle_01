    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-d3d35b35-3bc2.cloud.databricks.com
    variables:
      catalog: dbk_estudo_bundle_dev
      schema: dev
  prod:
    mode: production
    workspace:
